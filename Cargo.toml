[package]
name = "fastest-json-api-actix"
version = "0.1.0"
edition = "2021"
authors = ["BreakingTheBot"]
description = "Ultra-low-latency, zero-cost abstraction, high-throughput asynchronous JSON REST API built with Actix-Web in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/breakingthebot/fastest-json-api-actix-build74"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
actix-rt = "2.10"
actix-ws = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
env_logger = "0.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
num_cpus = "1.16"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
crc32fast = "1.4"

[dev-dependencies]
actix-web = { version = "4.9", features = ["macros"] }

[[bin]]
name = "fastest-json-api-actix"
path = "src/main.rs"

[[bin]]
name = "benchmark-client"
path = "src/bin/benchmark_client.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
